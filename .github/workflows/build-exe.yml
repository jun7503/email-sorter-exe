name: Build EmailSorter EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('build/requirements_frozen.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Print repo tree
        run: |
          echo "PWD:"
          pwd
          echo "Root listing:"
          dir
          echo "---- .github/workflows ----"
          dir .github\workflows
          echo "---- build ----"
          dir build
          echo "---- src ----"
          dir src

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/requirements_frozen.txt
          pip install pyinstaller

          echo "=== Python Version ==="
          python --version

          echo "=== Installed packages ==="
          python - <<EOF
          import pkgutil
          print([m.name for m in pkgutil.iter_modules()])
          EOF

      - name: Build EXE with PyInstaller
        run: |
          echo "=== Starting PyInstaller build ==="
          pyinstaller build/pyinstaller.spec --noconfirm --clean 2>&1 | tee build_log.txt
          echo "=== PyInstaller build finished ==="

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog
          path: build_log.txt

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmailSorter_EXE
          path: dist/EmailSorter.exe

      - name: Publish Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EmailSorter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
